<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jest · Join a Friend</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#0b111b;color:#e8f6ff;min-height:100vh;display:grid;place-items:center;padding:12px;box-sizing:border-box}.panel{width:min(420px,100%);background:#16283a;border:1px solid #3a6073;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 20px 60px #0006}h1{margin-top:0}p{color:#a7c0d0}input,button{border-radius:9px;padding:12px;font-size:17px}input{width:100%;box-sizing:border-box;background:#071a2a;color:white;border:1px solid #55758a;margin:5px 0 12px}button{background:#67dcb0;color:#092b20;font-weight:800;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;align-items:center}#status{min-height:38px}#connected{display:none}#matchPanel{border-top:1px solid #496274;margin-top:14px;padding-top:12px}.mp-muted{color:#b4c6d4;font-size:13px}.mp-dice{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.mp-die{display:flex;flex-direction:column;align-items:center;background:#e5eef6;color:#0b1826;border-radius:7px;padding:5px;min-width:38px;font-weight:900}.mp-hand{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.mp-owned-card{border:1px solid #496274;border-radius:8px;padding:7px 9px;font-size:13px}.mp-action{margin:4px 4px 4px 0;font-size:14px;padding:9px 12px}
</style></head><body><main class="panel"><h1>🎲 Jest · Join a Friend</h1><p>Enter the room code your friend created in Jest.</p><form id="form"><label for="code">Room code</label><input id="code" required maxlength="6" minlength="6" pattern="[A-Za-z0-9]{6}" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="ABC234"><label for="name">Your display name</label><input id="name" maxlength="30" placeholder="Friend"><button id="join" type="submit">Join Room</button></form><div id="connected"><p id="who"></p><div class="row"><button id="ready" type="button">Ready</button><button id="leave" type="button">Leave Room</button></div><p>Development preview: private hands and shops, selected Tricks and Jesters, white Trick die rewards and after-battle choices. Other card effects, upgrades and expansions are not yet fully playable online.</p></div><p id="status" role="status" aria-live="polite"></p><div id="matchPanel" hidden></div></main><script src="/match-ui.js"></script><script src="/guest-client.js"></script></body></html>
