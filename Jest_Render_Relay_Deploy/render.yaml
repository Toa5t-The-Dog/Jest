services:
  - type: web
    name: jest-room-relay
    runtime: node
    plan: free
    rootDir: Jest_Render_Relay_Deploy
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
